name: Build site

# Hostinger serves the committed dist/ folder, so rebuild and commit it
# whenever the source changes.
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'astro.config.mjs', 'package.json', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          git diff --cached --quiet || (git commit -m "Rebuild dist/" && git push)
